name: Publish
# Stub -> vish288/.github. Dispatch-only; release.yml dispatches it on the new tag ref.
# Name kept as publish.yml and id-token granted here for PyPI trusted publishing (the pypi
# environment lives on the reusable job). Ref flips to @v1 after R1a lands (orchestrator).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the state of each target; write nothing"
        type: boolean
        default: false
      fail_at:
        description: "Test hook: fail this job on attempt 1 before it writes"
        type: choice
        options: [none, pypi, release, registry]
        default: none
jobs:
  publish:
    uses: vish288/.github/.github/workflows/publish.yml@81cb5c053ebd2d1ae7897704dd8c35b1a925daf1
    with:
      dry_run: ${{ inputs.dry_run }}
      fail_at: ${{ inputs.fail_at }}
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      actions: read
